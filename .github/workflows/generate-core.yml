name: Repo2Gal Core

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      model:
        required: true
        type: string
      base_url:
        required: true
        type: string
      threads:
        required: true
        type: string
      source_context:
        required: false
        default: false
        type: boolean
      source_history:
        required: false
        default: "1"
        type: string
      performance:
        required: true
        type: boolean
      strict:
        required: true
        type: boolean
      strict_performance:
        required: true
        type: boolean
      dry_run:
        required: true
        type: boolean
      deploy_pages:
        required: true
        type: boolean
      force_run:
        required: false
        default: false
        type: boolean
      queue_file:
        required: false
        default: ""
        type: string
      queue_request_id:
        required: false
        default: ""
        type: string
      task_id:
        required: true
        type: string
      code_ref:
        required: false
        default: "main"
        type: string

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read
  discussions: read
  pages: write
  id-token: write

jobs:
  generate:
    name: Generate WebGAL artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      allowed: \${{ steps.price_gate.outputs.allowed }}
      generated: \${{ steps.state.outputs.generated }}
      slug: \${{ steps.target.outputs.slug }}
      artifact_name: \${{ steps.artifact.outputs.name }}
    env:
      GITHUB_TOKEN: \${{ secrets.REPO2GAL_GITHUB_TOKEN || github.token }}
      REPO2GAL_API_KEY: \${{ secrets.REPO2GAL_API_KEY }}
      REPO2GAL_BASE_URL: \${{ inputs.base_url }}
      REPO2GAL_MODEL: \${{ inputs.model }}

    steps:
      - name: Checkout Code2Gal
        uses: actions/checkout@v4
        with:
          ref: \${{ inputs.code_ref }}

      - name: Check DeepSeek price window
        id: price_gate
        shell: bash
        env:
          FORCE_RUN: \${{ inputs.force_run }}
          DRY_RUN: \${{ inputs.dry_run }}
          BASE_URL: \${{ inputs.base_url }}
        run: |
          set -euo pipefail

          if [[ "$FORCE_RUN" == "true" || "$DRY_RUN" == "true" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=forced-or-dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          normalized_base="\${BASE_URL%/}"
          if [[ "$normalized_base" != "https://api.deepseek.com/v1" && "$normalized_base" != "https://api.deepseek.com" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-deepseek-provider" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          weekday="$(TZ=Asia/Shanghai date +%u)"
          hhmm="$(TZ=Asia/Shanghai date +%H%M)"
          now="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"

          # DeepSeek V4 official off-peak whitelist, Beijing time.
          # Weekends are deliberately excluded from unattended runs.
          allowed=false
          if (( weekday >= 1 && weekday <= 5 )); then
            if (( 10#$hhmm < 900 )) ||
               (( 10#$hhmm >= 1200 && 10#$hhmm < 1400 )) ||
               (( 10#$hhmm >= 1800 )); then
              allowed=true
            fi
          fi

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "beijing_time=$now" >> "$GITHUB_OUTPUT"

          if [[ "$allowed" == "true" ]]; then
            echo "DeepSeek off-peak gate: allowed at $now"
          else
            echo "::notice::DeepSeek low-price gate blocked unattended generation at $now. The queued request is kept for a later window."
          fi

      - name: Normalize target repository
        id: target
        if: steps.price_gate.outputs.allowed == 'true'
        shell: bash
        env:
          TARGET_INPUT: \${{ inputs.repository }}
        run: |
          set -euo pipefail
          target="\${TARGET_INPUT#https://github.com/}"
          target="\${target%.git}"
          target="\${target%/}"

          if [[ ! "$target" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Repository must look like owner/repo or https://github.com/owner/repo"
            exit 2
          fi

          owner="\${target%%/*}"
          repo="\${target#*/}"
          slug="\${owner}-\${repo}"

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Check credentials
        if: steps.price_gate.outputs.allowed == 'true'
        shell: bash
        env:
          OPTIONAL_GITHUB_TOKEN: \${{ secrets.REPO2GAL_GITHUB_TOKEN }}
          CURRENT_REPOSITORY: \${{ github.repository }}
          TARGET_REPOSITORY: \${{ steps.target.outputs.target }}
          DRY_RUN: \${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "$DRY_RUN" != "true" && -z "\${REPO2GAL_API_KEY:-}" ]]; then
            echo "::error::Missing repository secret REPO2GAL_API_KEY. Add your DeepSeek/OpenAI-compatible API key in Settings > Secrets and variables > Actions."
            exit 2
          fi

          if [[ -z "\${OPTIONAL_GITHUB_TOKEN:-}" && "$TARGET_REPOSITORY" != "$CURRENT_REPOSITORY" ]]; then
            echo "::warning::Using the workflow's built-in github.token for an external public repository. If GitHub GraphQL/Discussion access is rejected, add a classic/fine-grained PAT as REPO2GAL_GITHUB_TOKEN."
          fi

      - name: Set up Python
        if: steps.price_gate.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependency
        if: steps.price_gate.outputs.allowed == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmagic1

      - name: Install Code2Gal
        if: steps.price_gate.outputs.allowed == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Restore WebGAL cache
        if: steps.price_gate.outputs.allowed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/repo2gal
          key: \${{ runner.os }}-repo2gal-webgal-\${{ hashFiles('repo2gal/packager.py') }}

      - name: Restore incremental repository backup
        if: steps.price_gate.outputs.allowed == 'true'
        uses: actions/cache@v4
        with:
          path: .repo2gal/backups/\${{ steps.target.outputs.owner }}
          key: \${{ runner.os }}-repo2gal-backup-\${{ steps.target.outputs.slug }}-\${{ github.run_id }}-\${{ inputs.task_id }}
          restore-keys: |
            \${{ runner.os }}-repo2gal-backup-\${{ steps.target.outputs.slug }}-

      - name: Validate built-in CC0 asset pack
        if: steps.price_gate.outputs.allowed == 'true' && !inputs.dry_run
        shell: bash
        run: repo2gal assets validate builtin:cc0-chronicle --public

      - name: Prepare audit metadata
        if: steps.price_gate.outputs.allowed == 'true'
        shell: bash
        env:
          TARGET_REPOSITORY: \${{ steps.target.outputs.target }}
          MODEL: \${{ inputs.model }}
          BASE_URL: \${{ inputs.base_url }}
          THREADS: \${{ inputs.threads }}
          SOURCE_CONTEXT: \${{ inputs.source_context }}
          SOURCE_HISTORY: \${{ inputs.source_history }}
          PERFORMANCE: \${{ inputs.performance }}
          STRICT: \${{ inputs.strict }}
          STRICT_PERFORMANCE: \${{ inputs.strict_performance }}
          DRY_RUN: \${{ inputs.dry_run }}
          CODE_REF: \${{ inputs.code_ref }}
        run: |
          set -euo pipefail
          mkdir -p .repo2gal/audit
          source_sha="$(git rev-parse HEAD)"
          {
            echo "target=$TARGET_REPOSITORY"
            echo "model=$MODEL"
            echo "base_url=$BASE_URL"
            echo "threads=$THREADS"
            echo "source_context=$SOURCE_CONTEXT"
            echo "source_history=$SOURCE_HISTORY"
            echo "performance=$PERFORMANCE"
            echo "strict=$STRICT"
            echo "strict_performance=$STRICT_PERFORMANCE"
            echo "dry_run=$DRY_RUN"
            echo "workflow_run=\${GITHUB_RUN_ID}"
            echo "code_ref=$CODE_REF"
            echo "source_sha=$source_sha"
          } > .repo2gal/audit/run-info.txt

      - name: Generate
        id: generate
        if: steps.price_gate.outputs.allowed == 'true'
        shell: bash
        env:
          TARGET_REPOSITORY: \${{ steps.target.outputs.target }}
          OUTPUT_REPO: \${{ steps.target.outputs.repo }}
          THREADS: \${{ inputs.threads }}
          SOURCE_CONTEXT: \${{ inputs.source_context }}
          SOURCE_HISTORY: \${{ inputs.source_history }}
          PERFORMANCE: \${{ inputs.performance }}
          STRICT: \${{ inputs.strict }}
          STRICT_PERFORMANCE: \${{ inputs.strict_performance }}
          DRY_RUN: \${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          args=(
            "$TARGET_REPOSITORY"
            --threads "$THREADS"
            --save-prompt .repo2gal/audit/prompt.txt
          )

          if [[ "$SOURCE_CONTEXT" == "true" ]]; then
            args+=(
              --source-context
              --source-history "$SOURCE_HISTORY"
            )
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          else
            args+=(
              --output "output/$OUTPUT_REPO"
              --asset-pack builtin:cc0-chronicle
              --public-assets
            )

            if [[ "$PERFORMANCE" == "true" ]]; then
              args+=(
                --performance
                --save-beat-manifest .repo2gal/audit/beat-manifest.json
                --save-performance-plan .repo2gal/audit/performance-plan.json
                --save-performance-report .repo2gal/audit/performance-report.json
              )
              if [[ "$STRICT_PERFORMANCE" == "true" ]]; then
                args+=(--strict-performance)
              fi
            fi

            if [[ "$STRICT" == "true" ]]; then
              args+=(--strict)
            fi
          fi

          repo2gal "\${args[@]}"

      - name: Mark generation success
        id: state
        if: steps.generate.outcome == 'success'
        shell: bash
        run: echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Define artifact name
        id: artifact
        if: steps.generate.outcome == 'success'
        shell: bash
        env:
          SLUG: \${{ steps.target.outputs.slug }}
          TASK_ID: \${{ inputs.task_id }}
        run: echo "name=repo2gal-\${SLUG}-\${TASK_ID}" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        if: always()
        shell: bash
        env:
          ALLOWED: \${{ steps.price_gate.outputs.allowed }}
          TARGET_REPOSITORY: \${{ steps.target.outputs.target }}
          DRY_RUN: \${{ inputs.dry_run }}
          GENERATE_OUTCOME: \${{ steps.generate.outcome }}
        run: |
          {
            echo "## Repo2Gal"
            echo
            if [[ "$ALLOWED" != "true" ]]; then
              echo "- Status: deferred by DeepSeek low-price gate"
              echo "- Queue entry: \`\${{ inputs.queue_file || 'none' }}\`"
            else
              printf '%s\n' "- Target: \`$TARGET_REPOSITORY\`"
              printf '%s\n' "- Result: \`$GENERATE_OUTCOME\`"
              printf '%s\n' "- Dry run: \`$DRY_RUN\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WebGAL and audit files
        if: \${{ always() && steps.price_gate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: \${{ steps.artifact.outputs.name || format('repo2gal-failed-{0}', inputs.task_id) }}
          path: |
            output/
            .repo2gal/audit/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  clear_queue:
    name: Remove completed queue entry
    needs: generate
    if: \${{ needs.generate.outputs.generated == 'true' && inputs.queue_file != '' && inputs.queue_request_id != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: code2gal-generation-queue
      cancel-in-progress: false
    steps:
      - name: Checkout generation queue
        uses: actions/checkout@v4
        with:
          ref: generation-queue
          path: generation-queue
          fetch-depth: 1

      - name: Remove matching queue request
        shell: bash
        env:
          QUEUE_FILE: \${{ inputs.queue_file }}
          REQUEST_ID: \${{ inputs.queue_request_id }}
        run: |
          set -euo pipefail
          cd generation-queue

          if [[ ! -f "$QUEUE_FILE" ]]; then
            echo "Queue entry already gone: $QUEUE_FILE"
            exit 0
          fi

          current="$(jq -r '.request_id // ""' "$QUEUE_FILE")"
          if [[ "$current" != "$REQUEST_ID" ]]; then
            echo "Queue entry was replaced by a newer request; keeping it."
            exit 0
          fi

          rm -f "$QUEUE_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "queue: complete $REQUEST_ID"
          git push origin HEAD:generation-queue

  deploy:
    name: Deploy WebGAL to GitHub Pages
    needs: generate
    if: \${{ needs.generate.outputs.generated == 'true' && !inputs.dry_run && inputs.deploy_pages }}
    runs-on: ubuntu-latest
    concurrency:
      group: code2gal-pages-store
      cancel-in-progress: false
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code2Gal deployment tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: code2gal

      - name: Checkout persistent Pages store
        uses: actions/checkout@v4
        with:
          ref: pages-store
          path: pages-store
          fetch-depth: 1

      - name: Download generated WebGAL artifact
        uses: actions/download-artifact@v8
        with:
          name: \${{ needs.generate.outputs.artifact_name }}
          path: artifact

      - name: Locate generated WebGAL site
        id: site
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t indexes < <(find artifact/output -mindepth 2 -maxdepth 2 -type f -name index.html -print)
          if [[ \${#indexes[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one WebGAL site under artifact/output, found \${#indexes[@]}."
            printf '%s\n' "\${indexes[@]}"
            exit 2
          fi
          site_dir="$(dirname "\${indexes[0]}")"
          echo "path=$site_dir" >> "$GITHUB_OUTPUT"
          echo "project=$(basename "$site_dir")" >> "$GITHUB_OUTPUT"

      - name: Merge project into persistent Pages store
        shell: bash
        run: |
          set -euo pipefail
          python code2gal/tools/update_pages_store.py \
            --site "\${{ steps.site.outputs.path }}" \
            --store pages-store \
            --project "\${{ steps.site.outputs.project }}"

      - name: Save persistent Pages store
        shell: bash
        working-directory: pages-store
        env:
          PROJECT: \${{ steps.site.outputs.project }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Pages store already matches this project."
          else
            tree="$(git write-tree)"
            commit="$(printf 'pages: publish %s\n' "$PROJECT" | git commit-tree "$tree")"
            git push --force origin "$commit:pages-store"
          fi

      - name: Upload complete multi-project site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-store

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
