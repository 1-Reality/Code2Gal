name: Generate Repo2Gal

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target GitHub repository (owner/repo or GitHub URL)"
        required: true
        default: "1-Reality/Code2Gal"
        type: string
      model:
        description: "OpenAI-compatible model name"
        required: true
        default: "deepseek-v4-pro"
        type: string
      base_url:
        description: "OpenAI-compatible API base URL"
        required: true
        default: "https://api.deepseek.com/v1"
        type: string
      threads:
        description: "Hot Issue/PR/Discussion threads selected for context"
        required: true
        default: "12"
        type: string
      source_context:
        description: "Read current source and representative history files into the LLM context"
        required: true
        default: false
        type: boolean
      source_history:
        description: "Representative history source files to include (0-3)"
        required: true
        default: "1"
        type: string
      performance:
        description: "Enable the second LLM pass for dynamic performance"
        required: true
        default: true
        type: boolean
      strict:
        description: "Fail when the story validator has to degrade output"
        required: true
        default: false
        type: boolean
      strict_performance:
        description: "Fail instead of falling back when performance planning degrades"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Collect data and upload the prompt without calling the LLM"
        required: true
        default: false
        type: boolean
      deploy_pages:
        description: "Publish the generated WebGAL site to GitHub Pages"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: read
  pull-requests: read
  discussions: read

concurrency:
  group: repo2gal-generate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate WebGAL artifact
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.target.outputs.slug }}
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.REPO2GAL_GITHUB_TOKEN || github.token }}
      REPO2GAL_API_KEY: ${{ secrets.REPO2GAL_API_KEY }}
      REPO2GAL_BASE_URL: ${{ inputs.base_url }}
      REPO2GAL_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout Code2Gal
        uses: actions/checkout@v4

      - name: Normalize target repository
        id: target
        shell: bash
        env:
          TARGET_INPUT: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          target="${TARGET_INPUT#https://github.com/}"
          target="${target%.git}"
          target="${target%/}"

          if [[ ! "$target" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Repository must look like owner/repo or https://github.com/owner/repo"
            exit 2
          fi

          owner="${target%%/*}"
          repo="${target#*/}"
          slug="${owner}-${repo}"

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Check credentials
        shell: bash
        env:
          OPTIONAL_GITHUB_TOKEN: ${{ secrets.REPO2GAL_GITHUB_TOKEN }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.target }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "$DRY_RUN" != "true" && -z "${REPO2GAL_API_KEY:-}" ]]; then
            echo "::error::Missing repository secret REPO2GAL_API_KEY. Add your DeepSeek/OpenAI-compatible API key in Settings > Secrets and variables > Actions."
            exit 2
          fi

          if [[ -z "${OPTIONAL_GITHUB_TOKEN:-}" && "$TARGET_REPOSITORY" != "$CURRENT_REPOSITORY" ]]; then
            echo "::warning::Using the workflow's built-in github.token for an external public repository. If GitHub GraphQL/Discussion access is rejected, add a classic/fine-grained PAT as REPO2GAL_GITHUB_TOKEN."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmagic1

      - name: Install Code2Gal
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Restore WebGAL cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/repo2gal
          key: ${{ runner.os }}-repo2gal-webgal-${{ hashFiles('repo2gal/packager.py') }}

      - name: Restore incremental repository backup
        uses: actions/cache@v4
        with:
          path: .repo2gal/backups/${{ steps.target.outputs.owner }}
          key: ${{ runner.os }}-repo2gal-backup-${{ steps.target.outputs.slug }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-repo2gal-backup-${{ steps.target.outputs.slug }}-

      - name: Validate built-in CC0 asset pack
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: repo2gal assets validate builtin:cc0-chronicle --public

      - name: Prepare audit metadata
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ steps.target.outputs.target }}
          MODEL: ${{ inputs.model }}
          BASE_URL: ${{ inputs.base_url }}
          THREADS: ${{ inputs.threads }}
          SOURCE_CONTEXT: ${{ inputs.source_context }}
          SOURCE_HISTORY: ${{ inputs.source_history }}
          PERFORMANCE: ${{ inputs.performance }}
          STRICT: ${{ inputs.strict }}
          STRICT_PERFORMANCE: ${{ inputs.strict_performance }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p .repo2gal/audit
          {
            echo "target=$TARGET_REPOSITORY"
            echo "model=$MODEL"
            echo "base_url=$BASE_URL"
            echo "threads=$THREADS"
            echo "source_context=$SOURCE_CONTEXT"
            echo "source_history=$SOURCE_HISTORY"
            echo "performance=$PERFORMANCE"
            echo "strict=$STRICT"
            echo "strict_performance=$STRICT_PERFORMANCE"
            echo "dry_run=$DRY_RUN"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "source_sha=${GITHUB_SHA}"
          } > .repo2gal/audit/run-info.txt

      - name: Generate
        id: generate
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ steps.target.outputs.target }}
          OUTPUT_REPO: ${{ steps.target.outputs.repo }}
          THREADS: ${{ inputs.threads }}
          SOURCE_CONTEXT: ${{ inputs.source_context }}
          SOURCE_HISTORY: ${{ inputs.source_history }}
          PERFORMANCE: ${{ inputs.performance }}
          STRICT: ${{ inputs.strict }}
          STRICT_PERFORMANCE: ${{ inputs.strict_performance }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          args=(
            "$TARGET_REPOSITORY"
            --threads "$THREADS"
            --save-prompt .repo2gal/audit/prompt.txt
          )

          if [[ "$SOURCE_CONTEXT" == "true" ]]; then
            args+=(
              --source-context
              --source-history "$SOURCE_HISTORY"
            )
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          else
            args+=(
              --output "output/$OUTPUT_REPO"
              --asset-pack builtin:cc0-chronicle
              --public-assets
            )

            if [[ "$PERFORMANCE" == "true" ]]; then
              args+=(
                --performance
                --save-beat-manifest .repo2gal/audit/beat-manifest.json
                --save-performance-plan .repo2gal/audit/performance-plan.json
                --save-performance-report .repo2gal/audit/performance-report.json
              )
              if [[ "$STRICT_PERFORMANCE" == "true" ]]; then
                args+=(--strict-performance)
              fi
            fi

            if [[ "$STRICT" == "true" ]]; then
              args+=(--strict)
            fi
          fi

          repo2gal "${args[@]}"

      - name: Write run summary
        if: always()
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ steps.target.outputs.target }}
          OUTPUT_REPO: ${{ steps.target.outputs.repo }}
          DRY_RUN: ${{ inputs.dry_run }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          {
            echo "## Repo2Gal"
            echo
            printf '%s\n' "- Target: \`$TARGET_REPOSITORY\`"
            printf '%s\n' "- Result: \`$GENERATE_OUTCOME\`"
            printf '%s\n' "- Dry run: \`$DRY_RUN\`"
            if [[ "$DRY_RUN" != "true" && -f "output/$OUTPUT_REPO/index.html" ]]; then
              echo "- WebGAL site: included in the downloadable Actions artifact"
            else
              echo "- Prompt/audit files: included in the downloadable Actions artifact"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WebGAL and audit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo2gal-${{ steps.target.outputs.slug }}-${{ github.run_number }}
          path: |
            output/${{ steps.target.outputs.repo }}/
            .repo2gal/audit/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  deploy:
    name: Deploy WebGAL to GitHub Pages
    if: ${{ !inputs.dry_run && inputs.deploy_pages }}
    needs: generate
    runs-on: ubuntu-latest
    concurrency:
      group: code2gal-pages-store
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code2Gal deployment tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: code2gal

      - name: Checkout persistent Pages store
        uses: actions/checkout@v4
        with:
          ref: pages-store
          path: pages-store
          fetch-depth: 1

      - name: Download generated WebGAL artifact
        uses: actions/download-artifact@v8
        with:
          name: repo2gal-${{ needs.generate.outputs.slug }}-${{ github.run_number }}
          path: artifact

      - name: Locate generated WebGAL site
        id: site
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t indexes < <(find artifact/output -mindepth 2 -maxdepth 2 -type f -name index.html -print)
          if [[ ${#indexes[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one WebGAL site under artifact/output, found ${#indexes[@]}."
            printf '%s\n' "${indexes[@]}"
            exit 2
          fi
          site_dir="$(dirname "${indexes[0]}")"
          echo "path=$site_dir" >> "$GITHUB_OUTPUT"
          echo "project=$(basename "$site_dir")" >> "$GITHUB_OUTPUT"

      - name: Merge project into persistent Pages store
        shell: bash
        run: |
          set -euo pipefail
          python code2gal/tools/update_pages_store.py \
            --site "${{ steps.site.outputs.path }}" \
            --store pages-store \
            --project "${{ steps.site.outputs.project }}"

      - name: Save persistent Pages store
        shell: bash
        working-directory: pages-store
        env:
          PROJECT: ${{ steps.site.outputs.project }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Pages store already matches this project."
          else
            tree="$(git write-tree)"
            commit="$(printf 'pages: publish %s\n' "$PROJECT" | git commit-tree "$tree")"
            git push --force origin "$commit:pages-store"
          fi

      - name: Upload complete multi-project site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-store

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
