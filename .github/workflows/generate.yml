name: Generate Repo2Gal

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target GitHub repository (owner/repo or GitHub URL)"
        required: true
        default: "1-Reality/Code2Gal"
        type: string
      queue_name:
        description: "Queue name. Same repo + same name replaces; different names can coexist."
        required: true
        default: "default"
        type: string
      run_now:
        description: "Run immediately and ignore the DeepSeek off-peak gate"
        required: true
        default: false
        type: boolean
      model:
        description: "OpenAI-compatible model name"
        required: true
        default: "deepseek-v4-pro"
        type: string
      base_url:
        description: "OpenAI-compatible API base URL"
        required: true
        default: "https://api.deepseek.com/v1"
        type: string
      threads:
        description: "Hot Issue/PR/Discussion threads selected for context"
        required: true
        default: "12"
        type: string
      performance:
        description: "Enable the second LLM pass for dynamic performance"
        required: true
        default: true
        type: boolean
      strict:
        description: "Fail when the story validator has to degrade output"
        required: true
        default: false
        type: boolean
      strict_performance:
        description: "Fail instead of falling back when performance planning degrades"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Collect data and upload the prompt without calling the LLM"
        required: true
        default: false
        type: boolean
      deploy_pages:
        description: "Publish the generated WebGAL site to GitHub Pages"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read
  discussions: read
  pages: write
  id-token: write

jobs:
  route:
    name: Route generation request
    runs-on: ubuntu-latest
    concurrency:
      group: code2gal-generation-queue
      cancel-in-progress: false
    outputs:
      execute: \${{ steps.route.outputs.execute }}
      queue_file: \${{ steps.route.outputs.queue_file }}
      request_id: \${{ steps.route.outputs.request_id }}
      task_id: \${{ steps.route.outputs.task_id }}

    steps:
      - name: Checkout generation queue
        uses: actions/checkout@v4
        with:
          ref: generation-queue
          path: generation-queue
          fetch-depth: 1

      - name: Route request
        id: route
        shell: bash
        env:
          TARGET_INPUT: \${{ inputs.repository }}
          QUEUE_NAME: \${{ inputs.queue_name }}
          RUN_NOW: \${{ inputs.run_now }}
          MODEL: \${{ inputs.model }}
          BASE_URL: \${{ inputs.base_url }}
          THREADS: \${{ inputs.threads }}
          PERFORMANCE: \${{ inputs.performance }}
          STRICT: \${{ inputs.strict }}
          STRICT_PERFORMANCE: \${{ inputs.strict_performance }}
          DRY_RUN: \${{ inputs.dry_run }}
          DEPLOY_PAGES: \${{ inputs.deploy_pages }}
          CODE_REF: \${{ github.ref_name }}
        run: |
          set -euo pipefail

          target="\${TARGET_INPUT#https://github.com/}"
          target="\${target%.git}"
          target="\${target%/}"
          if [[ ! "$target" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Repository must look like owner/repo or https://github.com/owner/repo"
            exit 2
          fi

          name="$(printf '%s' "$QUEUE_NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ -n "$name" ]] || name="default"

          request_id="\${GITHUB_RUN_ID}-\${GITHUB_RUN_ATTEMPT}"
          key="$(printf '%s\n%s' "$target" "$name" | sha256sum | cut -c1-16)"
          task_id="run-\${GITHUB_RUN_NUMBER}-\${key}"
          queue_file=""

          normalized_base="\${BASE_URL%/}"
          is_deepseek=false
          if [[ "$normalized_base" == "https://api.deepseek.com/v1" || "$normalized_base" == "https://api.deepseek.com" ]]; then
            is_deepseek=true
          fi

          execute=false
          reason="queued"

          if [[ "$RUN_NOW" == "true" || "$DRY_RUN" == "true" || "$is_deepseek" == "false" ]]; then
            execute=true
            reason="immediate"
          else
            queue_file="queue/\${key}.json"
            mkdir -p "generation-queue/queue"

            jq -n \
              --arg request_id "$request_id" \
              --arg queue_name "$name" \
              --arg task_id "$task_id" \
              --arg repository "$target" \
              --arg model "$MODEL" \
              --arg base_url "$BASE_URL" \
              --arg threads "$THREADS" \
              --arg source_history "1" \
              --arg code_ref "$CODE_REF" \
              --argjson source_context false \
              --argjson performance "$PERFORMANCE" \
              --argjson strict "$STRICT" \
              --argjson strict_performance "$STRICT_PERFORMANCE" \
              --argjson dry_run "$DRY_RUN" \
              --argjson deploy_pages "$DEPLOY_PAGES" \
              '{
                request_id: $request_id,
                queue_name: $queue_name,
                task_id: $task_id,
                repository: $repository,
                model: $model,
                base_url: $base_url,
                threads: $threads,
                source_context: $source_context,
                source_history: $source_history,
                performance: $performance,
                strict: $strict,
                strict_performance: $strict_performance,
                dry_run: $dry_run,
                deploy_pages: $deploy_pages,
                code_ref: $code_ref
              }' > "generation-queue/$queue_file"

            hhmm="$(TZ=Asia/Shanghai date +%H%M)"
            if (( 10#$hhmm < 900 )) ||
               (( 10#$hhmm >= 1200 && 10#$hhmm < 1400 )) ||
               (( 10#$hhmm >= 1800 )); then
              execute=true
              reason="off-peak-now"
            fi
          fi

          {
            echo "execute=$execute"
            echo "queue_file=$queue_file"
            echo "request_id=$request_id"
            echo "task_id=$task_id"
          } >> "$GITHUB_OUTPUT"

          echo "Route: $reason"
          echo "Beijing time: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Save queue entry
        if: steps.route.outputs.queue_file != ''
        shell: bash
        working-directory: generation-queue
        env:
          QUEUE_FILE: \${{ steps.route.outputs.queue_file }}
          REQUEST_ID: \${{ steps.route.outputs.request_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$QUEUE_FILE"

          if git diff --cached --quiet; then
            echo "Queue entry unchanged."
            exit 0
          fi

          git commit -m "queue: save $REQUEST_ID"
          git push origin HEAD:generation-queue

      - name: Write routing summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Repo2Gal routing"
            echo
            echo "- Run now: \`\${{ inputs.run_now }}\`"
            echo "- Execute in this run: \`\${{ steps.route.outputs.execute }}\`"
            if [[ -n "\${{ steps.route.outputs.queue_file }}" ]]; then
              echo "- Queue entry: \`\${{ steps.route.outputs.queue_file }}\`"
            fi
            echo "- Beijing time: \`$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\`"
          } >> "$GITHUB_STEP_SUMMARY"

  generate:
    name: Generate now
    needs: route
    if: needs.route.outputs.execute == 'true'
    uses: ./.github/workflows/generate-core.yml
    with:
      repository: \${{ inputs.repository }}
      model: \${{ inputs.model }}
      base_url: \${{ inputs.base_url }}
      threads: \${{ inputs.threads }}
      source_context: false
      source_history: "1"
      performance: \${{ inputs.performance }}
      strict: \${{ inputs.strict }}
      strict_performance: \${{ inputs.strict_performance }}
      dry_run: \${{ inputs.dry_run }}
      deploy_pages: \${{ inputs.deploy_pages }}
      force_run: \${{ inputs.run_now || inputs.dry_run }}
      queue_file: \${{ needs.route.outputs.queue_file }}
      queue_request_id: \${{ needs.route.outputs.request_id }}
      task_id: \${{ needs.route.outputs.task_id }}
      code_ref: \${{ github.ref_name }}
    secrets: inherit
