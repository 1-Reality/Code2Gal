<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bro-Stat 演示舞台</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;color:#fff}
body.nocur,body.nocur *{cursor:none!important}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#0b1020;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transition:transform .95s cubic-bezier(.65,0,.25,1)}
iframe.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;background:#fff;opacity:0;transition:opacity .55s}
iframe.scene.on{opacity:1}
#spot{position:absolute;pointer-events:none;border-radius:14px;border:2px solid rgba(139,108,255,.95);box-shadow:0 0 0 4000px rgba(6,8,18,.64),0 0 30px rgba(139,108,255,.6);opacity:0;transition:all .75s cubic-bezier(.65,0,.25,1);z-index:20}
#tag{position:absolute;pointer-events:none;opacity:0;transform:translateY(6px) scale(var(--inv,1));transition:opacity .5s,transform .5s,left .75s cubic-bezier(.65,0,.25,1),top .75s cubic-bezier(.65,0,.25,1);z-index:30;padding:8px 16px;border-radius:999px;background:linear-gradient(135deg,#6a4cff,#00b4ff);font-weight:700;font-size:26px;letter-spacing:.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap;transform-origin:0 100%}
#tag.on{opacity:1;transform:scale(var(--inv,1))}
#cur{position:absolute;left:0;top:0;width:30px;height:30px;pointer-events:none;z-index:50;opacity:0;transition:left 1s cubic-bezier(.5,0,.2,1),top 1s cubic-bezier(.5,0,.2,1),opacity .4s;transform-origin:0 0;transform:scale(var(--inv,1))}
#cur svg{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
#cur.click::after{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.95);animation:rip .5s ease-out}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(2.2);opacity:0}}

/* 代码页 */
#code{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#14171f;display:none;z-index:5;font-family:Consolas,'Cascadia Mono','Noto Sans Mono CJK SC',monospace}
#code.on{display:block}
#code .bar{height:64px;background:#0e1016;color:#9aa4c0;font:22px system-ui,'Microsoft YaHei',sans-serif;display:flex;align-items:center;padding:0 28px;gap:18px;border-bottom:1px solid #232838}
#code .bar b{color:#e6ebff;font-weight:600}#code .bar i{width:14px;height:14px;border-radius:50%;background:#ff5f57;box-shadow:24px 0 #febc2e,48px 0 #28c840;margin-right:56px}
#code .ln{height:35px;line-height:35px;font-size:25px;white-space:pre;color:#d7dcf0;padding-left:150px;position:relative;margin-top:0}
#code .ln:before{content:attr(data-n);position:absolute;left:60px;width:60px;text-align:right;color:#4a526e}
#code .ln.hl{background:rgba(139,108,255,.16)}
#code .k{color:#8fc7ff}#code .n{color:#ffb86b}#code .s{color:#b6e38a}#code .c{color:#6f7d98}#code .kw{color:#d49bff}
#code .body{padding-top:14px}
/* 标题卡 */
#card{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s;background:radial-gradient(1200px 700px at 30% 20%,#1b2250 0%,#0b1020 60%),#0b1020;overflow:hidden;text-align:center}
#card.on{opacity:1}
#card .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
#card .o1{width:620px;height:620px;background:#4b3bff;left:-120px;top:-160px}
#card .o2{width:560px;height:560px;background:#00a6ff;right:-100px;bottom:-180px;animation-delay:-5s}
#card .o3{width:340px;height:340px;background:#ff4fa3;right:22%;top:12%;opacity:.28;animation-delay:-9s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.18)}}
#card .kicker{position:relative;font-size:34px;letter-spacing:14px;color:#9fb4ff;margin-bottom:26px;font-weight:600;opacity:0;transform:translateY(14px)}
#card .title{position:relative;font-size:132px;font-weight:900;letter-spacing:6px;line-height:1.1;background:linear-gradient(180deg,#fff 30%,#b8c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(18px) scale(.97)}
#card .sub{position:relative;font-size:40px;color:#c7d0f5;margin-top:34px;letter-spacing:5px;opacity:0;transform:translateY(14px)}
#card.on .kicker{animation:up .8s .15s forwards cubic-bezier(.2,.7,.2,1)}
#card.on .title{animation:up .9s .3s forwards cubic-bezier(.2,.7,.2,1)}
#card.on .sub{animation:up .9s .55s forwards cubic-bezier(.2,.7,.2,1)}
@keyframes up{to{opacity:1;transform:none}}
#card.two .title{font-size:108px;letter-spacing:8px}
#card.two .sub{font-size:108px;font-weight:900;letter-spacing:8px;margin-top:22px;background:linear-gradient(180deg,#fff 30%,#b8c6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#card.todo .title{font-size:96px}
#card .note{position:absolute;bottom:60px;font-size:26px;color:#7e89b8;letter-spacing:3px}

/* 开场幕布 + HUD */
#badge{position:absolute;right:44px;top:34px;z-index:45;padding:12px 30px;border-radius:40px;background:rgba(18,80,58,.94);color:#8cf5c8;border:2px solid #6df2bd;font-size:36px;font-weight:700;letter-spacing:2px;opacity:0;transform:translateY(-10px);transition:all .4s;pointer-events:none}
#badge.on{opacity:1;transform:none}
#curtain{position:absolute;inset:0;z-index:100;background:#05070f;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;text-align:center}
#curtain.off{opacity:0;pointer-events:none}
#curtain h1{font-size:64px;margin:0 0 14px;letter-spacing:4px}
#curtain p{font-size:26px;color:#9aa6d6;margin:6px 0}
#curtain .keys{margin-top:44px;display:grid;grid-template-columns:auto auto;gap:10px 34px;font-size:26px;text-align:left}
#curtain kbd,#hud kbd{display:inline-block;min-width:44px;padding:2px 12px;border-radius:8px;background:#1b2347;border:1px solid #394687;color:#cfd8ff;font-family:Consolas,monospace;font-size:.9em;text-align:center}
#curtain .go{margin-top:48px;font-size:30px;color:#7c8cff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
#hud{position:absolute;left:24px;bottom:24px;z-index:200;width:560px;max-height:760px;overflow:auto;padding:18px 20px;border-radius:16px;background:rgba(10,14,32,.92);border:1px solid #2c3770;font-size:21px;line-height:1.55;display:none}
#hud.on{display:block}
#hud h3{margin:0 0 6px;font-size:22px;color:#9fb4ff}
#hud .sc{padding:1px 8px;border-radius:8px;color:#aeb8e8}
#hud .sc.cur{background:#26307a;color:#fff}
#hud .sc.todo{opacity:.45}
#hud .cu{padding-left:8px;color:#aeb8e8}
#hud .cu.done{color:#5ee0a3}
#hud .cu.next{color:#fff;font-weight:700}
#hud hr{border:0;border-top:1px solid #2c3770;margin:12px 0}
#hud .legend{font-size:18px;color:#8e9ad0}
</style>
</head>
<body class="nocur">
<div id="canvas">
  <div id="cam">
    <iframe id="fa" class="scene"></iframe>
    <iframe id="fb" class="scene"></iframe>
    <div id="code"><div class="bar"><i></i><b>Tampermonkey</b> › Bro-Stat · 锐捷版 › 编辑</div><div class="body"></div></div>
    <div id="spot"></div>
    <div id="tag"></div>
    <div id="cur"><svg viewBox="0 0 24 24"><path d="M3 2l17 10.2-7.4 1.6 4.2 7.3-3.1 1.8-4.2-7.3L4.8 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
  </div>
  <div id="card"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><div class="kicker"></div><div class="title"></div><div class="sub"></div><div class="note"></div></div>
  <div id="hud"></div>
  <div id="badge"></div>
  <div id="curtain">
    <h1>Bro-Stat 演示舞台</h1>
    <p>开录之前先看这里；按键之后这块幕布会淡出，不会入镜</p>
    <div class="keys">
      <div><kbd>→</kbd> / <kbd>Enter</kbd> / <kbd>PgDn</kbd></div><div>下一幕</div>
      <div><kbd>←</kbd> / <kbd>PgUp</kbd></div><div>上一幕</div>
      <div><kbd>空格</kbd></div><div>推进本幕里的下一个镜头（推近 / 高亮 / 触发事件）</div>
      <div><kbd>R</kbd></div><div>重来本幕</div>
      <div><kbd>P</kbd></div><div>暂停 / 继续数据</div>
      <div><kbd>L</kbd></div><div>显示 / 隐藏高亮标签</div>
      <div><kbd>H</kbd></div><div>导演面板（录制前对稿用，录像时关掉）</div>
      <div><kbd>F</kbd></div><div>全屏</div>
      <div><kbd>M</kbd></div><div>显示 / 隐藏鼠标指针</div>
    </div>
    <div class="go">按任意键开始</div>
  </div>
</div>
